version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_QUANT_URL=http://quant:8000
      - QUANT_URL=http://quant:8000
    depends_on:
      - quant
    restart: unless-stopped

  quant:
    build:
      context: .
      dockerfile: apps/quant/Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: borsa
      POSTGRES_PASSWORD: borsa
      POSTGRES_DB: borsa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata: