<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ERKEKLER | KADINLAR | TRAVESTİLER - Büyük Final</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #0a0f1e, #000000);
            font-family: 'Segoe UI', 'Poppins', 'Impact', 'Arial Black', sans-serif;
            overflow: hidden;
            position: relative;
            transition: all 0.5s ease;
        }

        /* TRAVESTİ FİNALİ İÇİN ARKA PLAN */
        body.travesti-final {
            background: radial-gradient(circle at center, #ff1493, #ff6600, #ffcc00, #ff00ff);
            animation: rainbowBg 0.3s infinite alternate;
        }

        @keyframes rainbowBg {
            0% { background: radial-gradient(circle at center, #ff1493, #ff6600, #ffcc00); }
            50% { background: radial-gradient(circle at center, #00ffff, #ff00ff, #ffcc00); }
            100% { background: radial-gradient(circle at center, #ff6600, #ff1493, #00ffcc); }
        }

        /* SOL ÜST LİSTE ALANI */
        .sol-liste {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 18px 22px;
            border-left: 6px solid #ff6600;
            box-shadow: 0 0 40px rgba(255, 100, 0, 0.4);
            max-height: 85vh;
            overflow-y: auto;
            min-width: 240px;
            transition: all 0.3s;
        }

        .sol-liste.travesti-aninda {
            background: rgba(0,0,0,0.9);
            border-left-color: #ff00ff;
            box-shadow: 0 0 50px #ff00ff;
        }

        .sol-liste::-webkit-scrollbar {
            width: 5px;
        }
        .sol-liste::-webkit-scrollbar-track {
            background: #1a1a2e;
            border-radius: 10px;
        }
        .sol-liste::-webkit-scrollbar-thumb {
            background: #ff884d;
            border-radius: 10px;
        }

        .kategori {
            margin-top: 16px;
            margin-bottom: 8px;
        }
        .kategori:first-child {
            margin-top: 0;
        }
        .kategori-baslik {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            padding-bottom: 5px;
            border-bottom: 2px solid;
            display: inline-block;
            margin-bottom: 8px;
        }
        .erkek-baslik {
            color: #33ccff;
            border-bottom-color: #33ccff;
            text-shadow: 0 0 5px #33ccff;
        }
        .kadin-baslik {
            color: #ff66cc;
            border-bottom-color: #ff66cc;
            text-shadow: 0 0 5px #ff66cc;
        }

        .liste-item {
            color: #ffdd99;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 5px 0 5px 12px;
            border-bottom: 1px dotted rgba(255,100,0,0.2);
            font-family: monospace;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .liste-item.ali-item {
            color: #ffaa44;
            font-size: 1.3rem;
            text-shadow: 0 0 8px #ff6600;
            border-left: 3px solid #ffaa44;
            padding-left: 12px;
        }
        .liste-item.sultan-item {
            color: #ff99cc;
            font-size: 1.1rem;
        }

        /* ORTA ALAN - BÜYÜK EFEKTLİ İSİM */
        .orta-alan {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            perspective: 800px;
            z-index: 10;
            pointer-events: none;
        }

        #efektliIsim {
            display: inline-block;
            font-size: clamp(3rem, 12vw, 7rem);
            font-weight: 900;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, #ffd89b, #c7e9fb, #ffaa66);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255,200,0,0.6);
            white-space: nowrap;
            padding: 0.2em 0.6em;
            pointer-events: none;
        }

        /* TRAVESTİ FİNAL EKRANI */
        .travesti-final-ekrani {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            pointer-events: none;
        }

        .travesti-final-ekrani.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .travesti-dev-yazi {
            font-size: clamp(3rem, 15vw, 9rem);
            font-weight: 900;
            text-align: center;
            background: linear-gradient(45deg, #ff66cc, #ffcc00, #ff3399, #00ffff, #ff6600);
            background-size: 300% 300%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: rgbText 0.5s infinite alternate, textShake 0.2s infinite;
            letter-spacing: 0.1em;
            text-shadow: 0 0 30px rgba(255,255,255,0.8);
            margin-bottom: 30px;
        }

        @keyframes rgbText {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes textShake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-1px, -2px); }
            50% { transform: translate(-2px, 1px); }
            75% { transform: translate(2px, -1px); }
            100% { transform: translate(0,0); }
        }

        .travesti-emoji-deryasi {
            font-size: 4rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 90%;
            animation: emojiUcus 1s infinite alternate;
        }

        @keyframes emojiUcus {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(10deg); }
        }

        .travesti-emoji-deryasi span {
            display: inline-block;
            animation: emojiDans 0.5s infinite alternate;
            font-size: 4rem;
        }

        @keyframes emojiDans {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.3) rotate(15deg); }
        }

        /* Uçuşan emojiler */
        .uçan-emoji {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 9999;
            animation: uç 4s linear forwards;
        }

        @keyframes uç {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        /* ANİMASYONLAR */
        @keyframes depremSalla {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(6px, -4px) rotate(2deg); }
            20% { transform: translate(-7px, 3px) rotate(-2.5deg); }
            30% { transform: translate(8px, 5px) rotate(2.5deg); }
            40% { transform: translate(-6px, -3px) rotate(-2deg); }
            50% { transform: translate(7px, -2px) rotate(2deg); }
            60% { transform: translate(-8px, 4px) rotate(-2.5deg); }
            70% { transform: translate(5px, -4px) rotate(1.5deg); }
            80% { transform: translate(-5px, 3px) rotate(-1.5deg); }
            90% { transform: translate(3px, -2px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes katlan3D {
            0% { transform: rotateX(0deg) scale(1); opacity: 0; letter-spacing: 0.2em; }
            25% { transform: rotateX(90deg) scale(0.3); opacity: 0.6; }
            50% { transform: rotateX(0deg) scale(1.4); text-shadow: 0 0 50px red; }
            75% { transform: rotateX(20deg) scale(1.05); }
            100% { transform: rotateX(0deg) scale(1); letter-spacing: normal; }
        }

        @keyframes catlamaPatlama {
            0% { letter-spacing: 0.05em; text-shadow: 0 0 0px white; transform: scale(1); }
            30% { letter-spacing: 0.3em; text-shadow: 0 0 50px orange; transform: scale(1.5) rotate(4deg); }
            60% { letter-spacing: -0.05em; text-shadow: 0 0 80px red; transform: scale(0.8) rotate(-5deg); filter: blur(3px); }
            100% { letter-spacing: 0.03em; text-shadow: 0 0 30px gold; transform: scale(1) rotate(0); filter: blur(0); }
        }

        @keyframes firtinaDon {
            0% { transform: rotate(0deg) scale(0.1); opacity: 0; filter: blur(15px); }
            40% { transform: rotate(360deg) scale(1.6); opacity: 1; filter: blur(0); }
            70% { transform: rotate(540deg) scale(0.9); }
            100% { transform: rotate(720deg) scale(1); }
        }

        @keyframes ziplamaCatlak {
            0% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-80px) scale(1.3) rotate(15deg); text-shadow: 0 30px 40px cyan; }
            70% { transform: translateY(25px) scale(0.85) rotate(-8deg); }
            100% { transform: translateY(0) scale(1); }
        }

        @keyframes silkinmeDeprem {
            0%,100% { transform: translateX(0); }
            10% { transform: translateX(-18px); }
            20% { transform: translateX(18px); }
            30% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            50% { transform: translateX(-7px); }
            60% { transform: translateX(7px); }
            70% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        @keyframes epicPatlama {
            0% { transform: scale(0) rotate(-360deg); opacity: 0; text-shadow: 0 0 0px magenta; letter-spacing: -0.1em; }
            35% { transform: scale(1.7) rotate(20deg); opacity: 1; text-shadow: 0 0 60px cyan; letter-spacing: 0.2em; }
            65% { transform: scale(1.1) rotate(-8deg); text-shadow: 0 0 100px yellow, 0 0 20px red; }
            100% { transform: scale(1) rotate(0deg); letter-spacing: 0.05em; }
        }

        .body-shake {
            animation: bodyShake 0.2s ease-in-out 0s 2;
        }

        @keyframes bodyShake {
            0% { transform: translate(2px, 1px); }
            25% { transform: translate(-2px, -2px); }
            50% { transform: translate(3px, -1px); }
            75% { transform: translate(-2px, 2px); }
            100% { transform: translate(0,0); }
        }

        .crack-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 60%, rgba(255,80,0,0.3) 100%);
            z-index: 9999;
            mix-blend-mode: overlay;
            animation: fadeOut 0.35s forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>

    <div class="sol-liste">
        <div class="kategori">
            <div class="kategori-baslik erkek-baslik">👨 ERKEKLER</div>
            <div class="kategori-icerik" id="erkekListesi"></div>
        </div>
        <div class="kategori">
            <div class="kategori-baslik kadin-baslik">👩 KADINLAR</div>
            <div class="kategori-icerik" id="kadinListesi"></div>
        </div>
    </div>

    <div class="orta-alan">
        <div id="efektliIsim"></div>
    </div>

    <!-- TRAVESTİ FİNAL EKRANI -->
    <div class="travesti-final-ekrani" id="travestiFinal">
        <div class="travesti-dev-yazi" id="travestiYazi">💅 TRAVESTİLER 💅</div>
        <div class="travesti-emoji-deryasi" id="travestiEmojiler">
            <span>🌈</span> <span>💋</span> <span>💃</span> <span>🦄</span> <span>🔥</span> <span>💄</span>
            <span>👠</span> <span>🌟</span> <span>🎭</span> <span>🍆</span> <span>✨</span> <span>💎</span>
            <span>🌸</span> <span>⭐</span> <span>💖</span> <span>🎉</span> <span>💅</span> <span>👑</span>
        </div>
    </div>

    <script>
        const isimSırası = [
            { isim: "ALİ", kategori: "erkek" },
            { isim: "MENDERES", kategori: "erkek" },
            { isim: "YAVUZ", kategori: "erkek" },
            { isim: "SELİM", kategori: "erkek" },
            { isim: "SERDAR", kategori: "erkek" },
            { isim: "SELVİNAZ", kategori: "kadin" },
            { isim: "SAHURE", kategori: "kadin" },
            { isim: "SULTAN", kategori: "kadin", ozelNot: " (KÜÇÜK SELVİNAZ)" }
        ];

        let currentIndex = 0;
        const erkekListesiDiv = document.getElementById("erkekListesi");
        const kadinListesiDiv = document.getElementById("kadinListesi");
        const efektliIsimDiv = document.getElementById("efektliIsim");
        const travestiFinalDiv = document.getElementById("travestiFinal");
        const travestiYazi = document.getElementById("travestiYazi");

        let eklenenErkekler = [];
        let eklenenKadinlar = [];

        const animasyonlar = [
            "depremSalla", "katlan3D", "catlamaPatlama", "firtinaDon", 
            "ziplamaCatlak", "silkinmeDeprem", "epicPatlama", "depremSalla"
        ];

        function shakeBody() {
            document.body.classList.add("body-shake");
            setTimeout(() => document.body.classList.remove("body-shake"), 250);
        }

        function addCrackEffect() {
            const crack = document.createElement('div');
            crack.className = 'crack-overlay';
            document.body.appendChild(crack);
            setTimeout(() => crack.remove(), 350);
        }

        function uçanEmojiOlustur() {
            const emojiler = ['🌈', '💋', '💃', '🦄', '🔥', '💄', '👠', '🌟', '🎭', '🍆', '✨', '💎', '🌸', '💖', '🎉', '💅', '👑', '⭐'];
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const emoji = document.createElement('div');
                    emoji.className = 'uçan-emoji';
                    emoji.textContent = emojiler[Math.floor(Math.random() * emojiler.length)];
                    emoji.style.left = Math.random() * 100 + '%';
                    emoji.style.fontSize = (Math.random() * 3 + 1.5) + 'rem';
                    emoji.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    emoji.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(emoji);
                    setTimeout(() => emoji.remove(), 5000);
                }, i * 100);
            }
        }

        function listeyeIsimEkle(item) {
            const isim = item.isim;
            const kategori = item.kategori;
            let görünenIsim = isim;
            if (item.ozelNot) görünenIsim = isim + item.ozelNot;
            
            if (kategori === "erkek" && !eklenenErkekler.includes(isim)) {
                eklenenErkekler.push(isim);
                const listeItem = document.createElement('div');
                listeItem.className = 'liste-item';
                if (isim === "ALİ") listeItem.classList.add('ali-item');
                listeItem.textContent = görünenIsim;
                listeItem.style.opacity = "0";
                listeItem.style.transform = "translateX(-15px)";
                setTimeout(() => {
                    listeItem.style.transition = "all 0.4s ease";
                    listeItem.style.opacity = "1";
                    listeItem.style.transform = "translateX(0)";
                }, 50);
                erkekListesiDiv.appendChild(listeItem);
            } 
            else if (kategori === "kadin" && !eklenenKadinlar.includes(isim)) {
                eklenenKadinlar.push(isim);
                const listeItem = document.createElement('div');
                listeItem.className = 'liste-item';
                if (isim === "SULTAN") listeItem.classList.add('sultan-item');
                listeItem.textContent = görünenIsim;
                listeItem.style.opacity = "0";
                listeItem.style.transform = "translateX(-15px)";
                setTimeout(() => {
                    listeItem.style.transition = "all 0.4s ease";
                    listeItem.style.opacity = "1";
                    listeItem.style.transform = "translateX(0)";
                }, 50);
                kadinListesiDiv.appendChild(listeItem);
            }
            const listeKutusu = document.querySelector('.sol-liste');
            setTimeout(() => listeKutusu.scrollTop = listeKutusu.scrollHeight, 100);
        }

        function ortadaIsmiGoster(item, index) {
            let isim = item.isim;
            if (item.ozelNot && item.isim === "SULTAN") {
                // Ortada da aynı şekilde göster
                efektliIsimDiv.innerText = isim + item.ozelNot;
            } else {
                efektliIsimDiv.innerText = isim;
            }
            
            let animasyonAdi = (isim === "ALİ") ? "epicPatlama" : animasyonlar[index % animasyonlar.length];
            efektliIsimDiv.style.animation = "none";
            efektliIsimDiv.offsetHeight;
            efektliIsimDiv.style.animation = `${animasyonAdi} 0.8s cubic-bezier(0.2, 1.3, 0.8, 1) forwards`;
            shakeBody();
            addCrackEffect();
            if (animasyonAdi === "catlamaPatlama" || animasyonAdi === "katlan3D") {
                setTimeout(() => { shakeBody(); addCrackEffect(); }, 200);
            }
            if (isim === "ALİ") {
                setTimeout(() => shakeBody(), 100);
                setTimeout(() => shakeBody(), 300);
                setTimeout(() => addCrackEffect(), 150);
                document.body.style.background = "radial-gradient(circle at center, #2a0a1e, #000000)";
                setTimeout(() => document.body.style.background = "radial-gradient(circle at center, #0a0f1e, #000000)", 400);
            }
            if (item.kategori === "kadin") {
                setTimeout(() => {
                    efektliIsimDiv.style.background = "linear-gradient(135deg, #ff99cc, #ff66aa, #ff3399)";
                    efektliIsimDiv.style.backgroundClip = "text";
                    setTimeout(() => {
                        efektliIsimDiv.style.background = "linear-gradient(135deg, #ffd89b, #c7e9fb, #ffaa66)";
                        efektliIsimDiv.style.backgroundClip = "text";
                    }, 300);
                }, 100);
            }
            const animEnd = () => {
                efektliIsimDiv.style.animation = "";
                efektliIsimDiv.removeEventListener("animationend", animEnd);
            };
            efektliIsimDiv.addEventListener("animationend", animEnd, { once: true });
        }

        function travestiFinaliniBaslat() {
            // Arka planı değiştir
            document.body.classList.add("travesti-final");
            document.querySelector('.sol-liste').classList.add('travesti-aninda');
            
            // Uçan emojiler
            uçanEmojiOlustur();
            
            // Final ekranını göster
            travestiFinalDiv.classList.add('active');
            
            // 2.5 saniye bekle sonra "SENNNNNN YYYOOOOOUUUU" yazsın
            setTimeout(() => {
                // Efektli şekilde yazıyı değiştir
                travestiYazi.style.animation = "none";
                travestiYazi.offsetHeight;
                travestiYazi.innerHTML = "💅 SENNNNNN YYYOOOOOUUUU 💅";
                travestiYazi.style.animation = "rgbText 0.5s infinite alternate, textShake 0.2s infinite";
                
                // Ekstra sarsıntı ve çatlama
                shakeBody();
                addCrackEffect();
                setTimeout(() => shakeBody(), 200);
                setTimeout(() => addCrackEffect(), 400);
                setTimeout(() => shakeBody(), 600);
                
                // Ekstra emoji patlaması
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => uçanEmojiOlustur(), i * 100);
                }
            }, 2500);
            
            // Sürekli emoji yağmuru
            const emojiYagmur = setInterval(() => {
                if (travestiFinalDiv.classList.contains('active')) {
                    uçanEmojiOlustur();
                } else {
                    clearInterval(emojiYagmur);
                }
            }, 1500);
            
            // Ses efekti hissi için sürekli sallantı
            for (let i = 0; i < 10; i++) {
                setTimeout(() => shakeBody(), i * 200);
            }
        }

        function siradakiIsmiGoster() {
            if (currentIndex >= isimSırası.length) {
                setTimeout(() => {
                    travestiFinaliniBaslat();
                }, 500);
                return;
            }
            const item = isimSırası[currentIndex];
            ortadaIsmiGoster(item, currentIndex);
            setTimeout(() => listeyeIsimEkle(item), 600);
            currentIndex++;
            if (currentIndex < isimSırası.length) {
                setTimeout(() => siradakiIsmiGoster(), 2800);
            } else {
                setTimeout(() => {
                    travestiFinaliniBaslat();
                }, 3000);
            }
        }

        efektliIsimDiv.innerText = "✨";
        setTimeout(() => siradakiIsmiGoster(), 500);

        document.body.addEventListener("click", () => {
            shakeBody();
            addCrackEffect();
        });

        console.log("🔥 SULTAN (KÜÇÜK SELVİNAZ) eklendi. TRAVESTİLER yazısından sonra 2.5 saniye bekleyip SENNNNNN YYYOOOOOUUUU yazacak! 🔥");
    </script>
</body>
</html>
