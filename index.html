<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minik Yürekler Akademi Anaokulu | cagran.com.tr</title>
  <meta name="description" content="Minik Yürekler Akademi Anaokulu — Çocuk merkezli, oyun temelli, potansiyel odaklı eğitim. MEB onaylı anaokulu."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --sun:    #FFB830;
      --sky:    #4CB8F5;
      --grass:  #5DC95E;
      --coral:  #FF6B6B;
      --purple: #9B7FE8;
      --cream:  #FFF8F0;
      --dark:   #1E2A3A;
      --mid:    #4A5568;
      --light:  #F7F3EE;
      --white:  #FFFFFF;
      --radius: 24px;
      --shadow: 0 8px 32px rgba(76,184,245,.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--dark);
      overflow-x: hidden;
    }

    /* ── DECORATIVE DOTS ── */
    .dots-bg {
      position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background-image: radial-gradient(circle, rgba(76,184,245,.18) 2px, transparent 2px);
      background-size: 32px 32px;
    }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 999;
      background: rgba(255,248,240,.92);
      backdrop-filter: blur(12px);
      border-bottom: 2px dashed rgba(255,184,48,.35);
      padding: 0 5vw;
      display: flex; align-items: center; justify-content: space-between;
      height: 72px;
    }
    .nav-logo {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.15rem;
      color: var(--dark); text-decoration: none;
    }
    .nav-logo .heart { font-size: 1.5rem; animation: heartbeat 1.8s ease-in-out infinite; }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      30%      { transform: scale(1.2); }
      50%      { transform: scale(1.05); }
    }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a {
      font-weight: 700; font-size: .92rem; color: var(--mid);
      text-decoration: none; transition: color .2s;
      position: relative;
    }
    .nav-links a::after {
      content: ''; position: absolute; bottom: -3px; left: 0;
      width: 0; height: 3px; border-radius: 4px;
      background: var(--sun); transition: width .25s;
    }
    .nav-links a:hover { color: var(--dark); }
    .nav-links a:hover::after { width: 100%; }
    .nav-cta {
      background: var(--coral); color: #fff;
      border: none; border-radius: 50px; padding: 9px 22px;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: .92rem;
      cursor: pointer; text-decoration: none;
      box-shadow: 0 4px 14px rgba(255,107,107,.35);
      transition: transform .15s, box-shadow .15s;
    }
    .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,107,.45); }

    /* hamburger */
    .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
    .hamburger span { width: 26px; height: 3px; background: var(--dark); border-radius: 4px; transition: .3s; }

    /* ── HERO ── */
    #hero {
      position: relative; overflow: hidden;
      min-height: 92vh;
      display: flex; align-items: center;
      background: linear-gradient(135deg, #e8f7ff 0%, #fff8ec 60%, #ffeaea 100%);
      padding: 80px 5vw 60px;
    }
    #hero .dots-bg { opacity: .6; }
    .hero-inner {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center;
      max-width: 1200px; margin: auto; width: 100%;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,184,48,.18); border: 1.5px solid rgba(255,184,48,.5);
      color: #c47d00; border-radius: 50px; padding: 6px 16px;
      font-weight: 700; font-size: .82rem; letter-spacing: .04em;
      margin-bottom: 18px;
    }
    .hero-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sun); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .hero-text h1 {
      font-family: 'Baloo 2', cursive; font-weight: 800;
      font-size: clamp(2.2rem, 4vw, 3.4rem); line-height: 1.15;
      color: var(--dark); margin-bottom: 18px;
    }
    .hero-text h1 span { color: var(--sky); }
    .hero-text p {
      font-size: 1.05rem; line-height: 1.75; color: var(--mid);
      max-width: 480px; margin-bottom: 32px;
    }
    .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn-primary {
      background: var(--sky); color: #fff;
      border: none; border-radius: 50px; padding: 14px 30px;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1rem;
      cursor: pointer; text-decoration: none;
      box-shadow: 0 6px 20px rgba(76,184,245,.4);
      transition: transform .15s, box-shadow .15s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(76,184,245,.5); }
    .btn-secondary {
      background: transparent; color: var(--dark);
      border: 2px solid rgba(30,42,58,.2); border-radius: 50px; padding: 13px 28px;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1rem;
      cursor: pointer; text-decoration: none;
      transition: border-color .2s, background .2s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-secondary:hover { border-color: var(--sky); background: rgba(76,184,245,.07); }

    /* hero illustration */
    .hero-visual {
      display: flex; justify-content: center; align-items: center;
      position: relative;
    }
    .hero-card {
      background: var(--white); border-radius: 32px;
      box-shadow: 0 24px 60px rgba(76,184,245,.18);
      padding: 36px 30px; text-align: center;
      width: 340px; position: relative; z-index: 1;
      animation: floatCard 4s ease-in-out infinite;
    }
    @keyframes floatCard {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }
    .hero-emojis {
      font-size: 3.2rem; margin-bottom: 16px; display: flex;
      justify-content: center; gap: 10px; flex-wrap: wrap;
    }
    .hero-card h3 {
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.3rem;
      color: var(--dark); margin-bottom: 10px;
    }
    .hero-card p { font-size: .88rem; color: var(--mid); line-height: 1.6; }
    .hero-stats {
      display: flex; justify-content: space-around; margin-top: 22px;
      padding-top: 18px; border-top: 2px dashed rgba(76,184,245,.2);
    }
    .stat-item { text-align: center; }
    .stat-num {
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.5rem;
      color: var(--sky);
    }
    .stat-lbl { font-size: .75rem; color: var(--mid); font-weight: 700; }

    /* floating bubbles */
    .bubble {
      position: absolute; border-radius: 50%; opacity: .65;
      animation: floatBubble linear infinite;
    }
    @keyframes floatBubble {
      0%   { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-120px) rotate(360deg); }
    }

    /* ── SECTION SHARED ── */
    section { padding: 90px 5vw; }
    .section-label {
      font-size: .78rem; font-weight: 800; letter-spacing: .12em;
      text-transform: uppercase; color: var(--sky); margin-bottom: 10px;
    }
    .section-title {
      font-family: 'Baloo 2', cursive; font-weight: 800;
      font-size: clamp(1.8rem, 3vw, 2.6rem); color: var(--dark);
      margin-bottom: 14px; line-height: 1.2;
    }
    .section-sub { font-size: 1rem; color: var(--mid); line-height: 1.7; max-width: 580px; }
    .section-header { margin-bottom: 52px; }

    /* ── MEB STRIP ── */
    .meb-strip {
      background: linear-gradient(90deg, #c8102e 0%, #e63946 50%, #c8102e 100%);
      color: #fff; padding: 18px 5vw;
      display: flex; align-items: center; justify-content: center; gap: 16px;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1rem;
      text-align: center; flex-wrap: wrap;
    }
    .meb-strip .flag { font-size: 1.6rem; }
    .meb-strip strong { font-size: 1.1rem; }

    /* ── WHY US ── */
    #why {
      background: var(--light);
      position: relative; overflow: hidden;
    }
    .pillars {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px; max-width: 1200px; margin: auto;
    }
    .pillar {
      background: var(--white); border-radius: var(--radius);
      padding: 36px 28px; position: relative; overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,.05);
      transition: transform .25s, box-shadow .25s;
    }
    .pillar:hover { transform: translateY(-6px); box-shadow: 0 14px 40px rgba(0,0,0,.1); }
    .pillar-icon {
      width: 60px; height: 60px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; margin-bottom: 18px;
    }
    .pillar h3 {
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.15rem;
      color: var(--dark); margin-bottom: 10px;
    }
    .pillar p { font-size: .9rem; color: var(--mid); line-height: 1.65; }
    .pillar-accent {
      position: absolute; bottom: -20px; right: -20px;
      width: 80px; height: 80px; border-radius: 50%;
      opacity: .12;
    }

    /* ── PROGRAMS ── */
    #programs { max-width: 1200px; margin: auto; padding: 90px 0; }
    .programs-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
    }
    .prog-card {
      border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform .25s, box-shadow .25s;
      cursor: default;
    }
    .prog-card:hover { transform: translateY(-6px); box-shadow: 0 18px 48px rgba(0,0,0,.12); }
    .prog-top {
      padding: 32px 28px 24px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .prog-emoji { font-size: 2.4rem; }
    .prog-card h3 {
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.2rem;
      color: var(--dark);
    }
    .prog-card p { font-size: .88rem; color: var(--mid); line-height: 1.65; }
    .prog-bottom {
      padding: 16px 28px;
      font-size: .8rem; font-weight: 700; letter-spacing: .06em;
      color: rgba(255,255,255,.85);
    }
    .prog-tag {
      display: inline-block; background: rgba(255,255,255,.25);
      border-radius: 50px; padding: 4px 14px; margin: 2px 3px;
    }

    /* ── GALLERY ── */
    #gallery { background: var(--light); }
    #gallery .inner { max-width: 1200px; margin: auto; }
    .gallery-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: 240px 240px;
      gap: 16px; margin-top: 0;
    }
    .gallery-item {
      border-radius: 20px; overflow: hidden;
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    .gallery-item:first-child { grid-row: span 2; }
    .gallery-emoji-box {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      font-size: 3.5rem;
      transition: transform .3s;
    }
    .gallery-item:hover .gallery-emoji-box { transform: scale(1.06); }
    .gallery-lbl {
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: .88rem;
      color: rgba(30,42,58,.7);
    }

    /* ── TEACHERS ── */
    #teachers { max-width: 1200px; margin: auto; padding: 90px 0; }
    .teachers-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px;
    }
    .teacher-card {
      background: var(--white); border-radius: var(--radius);
      padding: 32px 20px; text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,.05);
      transition: transform .25s;
    }
    .teacher-card:hover { transform: translateY(-5px); }
    .teacher-avatar {
      width: 88px; height: 88px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; margin: 0 auto 16px;
    }
    .teacher-card h4 {
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1rem;
      color: var(--dark); margin-bottom: 5px;
    }
    .teacher-card span { font-size: .83rem; color: var(--mid); font-weight: 600; }

    /* ── FAQ ── */
    #faq { background: var(--light); }
    #faq .inner { max-width: 760px; margin: auto; }
    .faq-item {
      background: var(--white); border-radius: 16px;
      margin-bottom: 12px; overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.04);
    }
    .faq-q {
      padding: 20px 24px;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1rem;
      color: var(--dark); cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      user-select: none;
    }
    .faq-q .arrow { font-size: 1.1rem; transition: transform .3s; }
    .faq-item.open .faq-q .arrow { transform: rotate(180deg); }
    .faq-a {
      max-height: 0; overflow: hidden;
      padding: 0 24px; font-size: .92rem; color: var(--mid); line-height: 1.7;
      transition: max-height .4s ease, padding .3s;
    }
    .faq-item.open .faq-a { max-height: 300px; padding: 0 24px 20px; }

    /* ── CONTACT ── */
    #contact {
      background: linear-gradient(135deg, #1E2A3A 0%, #2d3f56 100%);
      color: #fff; position: relative; overflow: hidden;
    }
    #contact .dots-bg { opacity: .06; }
    .contact-inner {
      position: relative; z-index: 1;
      max-width: 1100px; margin: auto;
      display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start;
    }
    #contact .section-label { color: var(--sun); }
    #contact .section-title { color: #fff; }
    #contact .section-sub { color: rgba(255,255,255,.65); }
    .contact-items { margin-top: 32px; display: flex; flex-direction: column; gap: 18px; }
    .contact-item {
      display: flex; align-items: center; gap: 16px;
      background: rgba(255,255,255,.07); border-radius: 16px;
      padding: 16px 20px;
    }
    .contact-icon {
      width: 46px; height: 46px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; flex-shrink: 0;
    }
    .contact-item h4 { font-family:'Baloo 2',cursive; font-weight:700; font-size:.88rem; color:rgba(255,255,255,.5); margin-bottom:3px; }
    .contact-item p { font-weight:700; font-size:.98rem; color:#fff; }
    .contact-item a { color:#fff; text-decoration:none; }
    .contact-item a:hover { color: var(--sun); }

    /* form */
    .contact-form { background: var(--white); border-radius: 28px; padding: 36px 32px; }
    .contact-form h3 {
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.3rem;
      color: var(--dark); margin-bottom: 22px;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: .82rem; font-weight: 700; color: var(--mid); margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 2px solid rgba(76,184,245,.2); background: #f9fbfd;
      font-family: 'Nunito', sans-serif; font-size: .92rem; color: var(--dark);
      outline: none; transition: border-color .2s;
      resize: vertical;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--sky);
    }
    .form-group textarea { min-height: 90px; }
    .form-submit {
      width: 100%; padding: 14px; border: none; border-radius: 50px;
      background: linear-gradient(90deg, var(--sky), #2196f3);
      color: #fff; font-family: 'Baloo 2', cursive; font-weight: 700;
      font-size: 1rem; cursor: pointer;
      box-shadow: 0 6px 20px rgba(76,184,245,.4);
      transition: transform .15s, box-shadow .15s;
    }
    .form-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(76,184,245,.5); }
    .form-success {
      display: none; text-align: center; padding: 20px;
      color: var(--grass); font-family: 'Baloo 2', cursive;
      font-weight: 700; font-size: 1.1rem;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--dark); color: rgba(255,255,255,.6);
      padding: 48px 5vw 28px;
    }
    .footer-inner {
      max-width: 1100px; margin: auto;
      display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px;
      padding-bottom: 32px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .footer-brand { }
    .footer-logo {
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.2rem;
      color: #fff; display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .footer-brand p { font-size: .88rem; line-height: 1.7; max-width: 280px; }
    .footer-col h4 {
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: .95rem;
      color: #fff; margin-bottom: 14px;
    }
    .footer-col ul { list-style: none; }
    .footer-col ul li { margin-bottom: 8px; }
    .footer-col ul li a {
      color: rgba(255,255,255,.55); text-decoration: none;
      font-size: .88rem; transition: color .2s;
    }
    .footer-col ul li a:hover { color: var(--sun); }
    .footer-bottom {
      max-width: 1100px; margin: 20px auto 0;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 8px; font-size: .8rem;
    }
    .social-links { display: flex; gap: 12px; }
    .social-link {
      width: 38px; height: 38px; border-radius: 12px;
      background: rgba(255,255,255,.1); display: flex; align-items: center;
      justify-content: center; font-size: 1.1rem; text-decoration: none;
      transition: background .2s;
    }
    .social-link:hover { background: rgba(255,255,255,.2); }

    /* ── WHATSAPP FLOAT ── */
    .wa-float {
      position: fixed; bottom: 28px; right: 28px; z-index: 9999;
      width: 58px; height: 58px; border-radius: 50%;
      background: #25D366; display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; text-decoration: none; color: #fff;
      box-shadow: 0 6px 24px rgba(37,211,102,.4);
      animation: waFloat 3s ease-in-out infinite;
      transition: transform .2s;
    }
    .wa-float:hover { transform: scale(1.1); }
    @keyframes waFloat {
      0%,100% { box-shadow: 0 6px 24px rgba(37,211,102,.4); }
      50%      { box-shadow: 0 6px 36px rgba(37,211,102,.65); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .hero-inner { grid-template-columns: 1fr; text-align: center; }
      .hero-text p { margin: 0 auto 32px; }
      .hero-btns { justify-content: center; }
      .hero-visual { display: none; }
      .contact-inner { grid-template-columns: 1fr; }
      .footer-inner { grid-template-columns: 1fr; gap: 24px; }
      .gallery-grid {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto;
      }
      .gallery-item:first-child { grid-row: auto; }
      .form-row { grid-template-columns: 1fr; }
      .nav-links, .nav-cta { display: none; }
      .hamburger { display: flex; }
      #programs { padding: 90px 5vw; }
      #teachers { padding: 90px 5vw; }
    }
    @media (max-width: 500px) {
      .gallery-grid { grid-template-columns: 1fr; }
      .meb-strip { font-size: .9rem; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a href="#" class="nav-logo">
    <span class="heart">💛</span>
    Minik Yürekler Akademi
  </a>
  <ul class="nav-links">
    <li><a href="#why">Neden Biz</a></li>
