<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🎭 ERKEKLER | KADINLAR | TRAVESTİLER 🤡</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #0a0f1e, #000000);
            font-family: 'Segoe UI', 'Poppins', 'Impact', 'Arial Black', sans-serif;
            overflow-x: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        /* TRAVESTİ FİNAL ARKA PLANI */
        body.travesti-final {
            background: radial-gradient(circle at center, #ff1493, #ff6600, #ffcc00, #ff00ff);
            animation: rainbowBg 0.2s infinite alternate !important;
        }

        @keyframes rainbowBg {
            0% { background: radial-gradient(circle at center, #ff1493, #ff6600, #ffcc00); }
            50% { background: radial-gradient(circle at center, #00ffff, #ff00ff, #ffcc00); }
            100% { background: radial-gradient(circle at center, #ff6600, #ff1493, #00ffcc); }
        }

        /* SOL ÜST LİSTE */
        .sol-liste {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 12px 16px;
            border-left: 5px solid #ff6600;
            box-shadow: 0 0 30px rgba(255, 100, 0, 0.4);
            max-height: 35vh;
            overflow-y: auto;
            font-size: 14px;
        }

        .sol-liste.travesti-aninda {
            background: rgba(0,0,0,0.95);
            border-left-color: #ff00ff;
            box-shadow: 0 0 40px #ff00ff;
        }

        .kategori {
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .kategori:first-child { margin-top: 0; }
        .kategori-baslik {
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 1px;
            padding-bottom: 3px;
            border-bottom: 2px solid;
            display: inline-block;
            margin-bottom: 6px;
        }
        .erkek-baslik { color: #33ccff; border-bottom-color: #33ccff; }
        .kadin-baslik { color: #ff66cc; border-bottom-color: #ff66cc; }

        .liste-item {
            color: #ffdd99;
            font-size: 0.9rem;
            font-weight: bold;
            padding: 4px 0 4px 8px;
            border-bottom: 1px dotted rgba(255,100,0,0.2);
            font-family: monospace;
        }
        .liste-item.ali-item {
            color: #ffaa44;
            font-size: 1.1rem;
            text-shadow: 0 0 5px #ff6600;
            border-left: 3px solid #ffaa44;
            padding-left: 8px;
        }
        .liste-item.sultan-item {
            color: #ff99cc;
            font-size: 0.9rem;
        }

        /* ORTA ALAN - KOCAMAN YAZI */
        .orta-alan {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        #efektliIsim {
            display: inline-block;
            font-size: clamp(2rem, 10vw, 5rem);
            font-weight: 900;
            letter-spacing: 0.03em;
            background: linear-gradient(135deg, #ffd89b, #c7e9fb, #ffaa66);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255,200,0,0.5);
            white-space: normal;
            word-break: break-word;
            padding: 0.2em;
        }

        /* ========== ANİMASYONLAR (KESİN ÇALIŞIR) ========== */
        .anim-deprem {
            animation: depremSalla 0.5s cubic-bezier(0.2, 1.2, 0.8, 1) forwards !important;
        }
        .anim-katlan {
            animation: katlan3D 0.6s ease-out forwards !important;
        }
        .anim-catlama {
            animation: catlamaPatlama 0.6s cubic-bezier(0.3, 1.3, 0.7, 1) forwards !important;
        }
        .anim-firtina {
            animation: firtinaDon 0.7s ease-out forwards !important;
        }
        .anim-ziplama {
            animation: ziplamaCatlak 0.6s ease-out forwards !important;
        }
        .anim-silkinme {
            animation: silkinmeDeprem 0.5s ease-in-out forwards !important;
        }
        .anim-epic {
            animation: epicPatlama 0.8s cubic-bezier(0.2, 1.4, 0.8, 1) forwards !important;
        }

        @keyframes depremSalla {
            0% { transform: translate(0, 0); }
            10% { transform: translate(5px, -3px); }
            20% { transform: translate(-6px, 2px); }
            30% { transform: translate(6px, 3px); }
            40% { transform: translate(-5px, -2px); }
            50% { transform: translate(5px, -1px); }
            60% { transform: translate(-5px, 2px); }
            70% { transform: translate(3px, -2px); }
            80% { transform: translate(-3px, 1px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes katlan3D {
            0% { transform: rotateX(0deg) scale(1); opacity: 0; }
            25% { transform: rotateX(90deg) scale(0.4); opacity: 0.6; }
            50% { transform: rotateX(0deg) scale(1.3); text-shadow: 0 0 30px red; }
            100% { transform: rotateX(0deg) scale(1); }
        }

        @keyframes catlamaPatlama {
            0% { letter-spacing: 0.02em; transform: scale(1); }
            30% { letter-spacing: 0.15em; transform: scale(1.4) rotate(2deg); text-shadow: 0 0 30px orange; }
            60% { letter-spacing: -0.02em; transform: scale(0.85) rotate(-3deg); filter: blur(2px); }
            100% { letter-spacing: 0.02em; transform: scale(1); filter: blur(0); }
        }

        @keyframes firtinaDon {
            0% { transform: rotate(0deg) scale(0.2); opacity: 0; filter: blur(8px); }
            40% { transform: rotate(360deg) scale(1.4); opacity: 1; filter: blur(0); }
            100% { transform: rotate(720deg) scale(1); }
        }

        @keyframes ziplamaCatlak {
            0% { transform: translateY(0); }
            30% { transform: translateY(-60px) scale(1.2); }
            70% { transform: translateY(15px) scale(0.9); }
            100% { transform: translateY(0); }
        }

        @keyframes silkinmeDeprem {
            0%,100% { transform: translateX(0); }
            10% { transform: translateX(-12px); }
            20% { transform: translateX(12px); }
            30% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            50% { transform: translateX(-4px); }
            60% { transform: translateX(4px); }
        }

        @keyframes epicPatlama {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; letter-spacing: -0.05em; }
            35% { transform: scale(1.6) rotate(15deg); opacity: 1; letter-spacing: 0.15em; text-shadow: 0 0 40px magenta; }
            65% { transform: scale(1.1) rotate(-8deg); }
            100% { transform: scale(1) rotate(0deg); letter-spacing: 0.02em; }
        }

        /* TRAVESTİ FİNAL EKRANI */
        .travesti-final-ekrani {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            pointer-events: none;
            text-align: center;
            padding: 20px;
        }

        .travesti-final-ekrani.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .travesti-dev-yazi {
            font-size: clamp(2rem, 10vw, 5rem);
            font-weight: 900;
            background: linear-gradient(45deg, #ff66cc, #ffcc00, #ff3399, #00ffff, #ff6600);
            background-size: 300% 300%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: rgbText 0.3s infinite alternate, textShake 0.15s infinite;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        @keyframes rgbText {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes textShake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-1px, -1px); }
            50% { transform: translate(-1px, 1px); }
            75% { transform: translate(1px, -1px); }
            100% { transform: translate(0,0); }
        }

        .travesti-emoji-deryasi {
            font-size: 2.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 95%;
        }

        .travesti-emoji-deryasi span {
            display: inline-block;
            animation: emojiDans 0.4s infinite alternate;
            font-size: 2.5rem;
        }

        @keyframes emojiDans {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.3) rotate(10deg); }
        }

        /* Uçuşan emojiler */
        .uçan-emoji {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 9999;
            animation: uç 3s linear forwards;
        }

        @keyframes uç {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
        }

        .body-shake {
            animation: bodyShake 0.15s ease-in-out 0s 2 !important;
        }

        @keyframes bodyShake {
            0% { transform: translate(2px, 1px); }
            25% { transform: translate(-2px, -1px); }
            50% { transform: translate(2px, -1px); }
            75% { transform: translate(-2px, 1px); }
            100% { transform: translate(0,0); }
        }

        .crack-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, transparent 60%, rgba(255,80,0,0.3) 100%);
            z-index: 9999;
            mix-blend-mode: overlay;
            animation: fadeOut 0.3s forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        .click-info {
            position: fixed;
            bottom: 8px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            color: #888;
            background: rgba(0,0,0,0.5);
            padding: 4px;
            z-index: 200;
        }
    </style>
</head>
<body>

    <div class="sol-liste">
        <div class="kategori">
            <div class="kategori-baslik erkek-baslik">👨 ERKEKLER (Maço)</div>
            <div class="kategori-icerik" id="erkekListesi"></div>
        </div>
        <div class="kategori">
            <div class="kategori-baslik kadin-baslik">👩 KADINLAR (Hanım)</div>
            <div class="kategori-icerik" id="kadinListesi"></div>
        </div>
    </div>

    <div class="orta-alan">
        <div id="efektliIsim">✨</div>
    </div>

    <div class="click-info">👇 Tıkla deprem + emoji yağmuru!</div>

    <div class="travesti-final-ekrani" id="travestiFinal">
        <div class="travesti-dev-yazi" id="travestiYazi">🎭 TRAVESTİLER 🎭</div>
        <div class="travesti-emoji-deryasi">
            <span>🌈</span> <span>💋</span> <span>💃</span> <span>🦄</span> <span>🔥</span> <span>💄</span>
            <span>👠</span> <span>🌟</span> <span>🎭</span> <span>🍆</span> <span>✨</span> <span>💎</span>
            <span>🌸</span> <span>💖</span> <span>🎉</span> <span>💅</span> <span>👑</span> <span>🤡</span>
        </div>
    </div>

    <script>
        const isimSırası = [
            { isim: "ALİ", kategori: "erkek", anim: "epic" },
            { isim: "MENDERES", kategori: "erkek", anim: "deprem" },
            { isim: "YAVUZ", kategori: "erkek", anim: "katlan" },
            { isim: "SELİM", kategori: "erkek", anim: "catlama" },
            { isim: "SERDAR", kategori: "erkek", anim: "firtina" },
            { isim: "SELVİNAZ", kategori: "kadin", anim: "ziplama" },
            { isim: "SAHURE", kategori: "kadin", anim: "silkinme" },
            { isim: "SULTAN", kategori: "kadin", anim: "deprem", ozelNot: " 🤭 (Küçük Selvinaz)" }
        ];

        let currentIndex = 0;
        const erkekListesiDiv = document.getElementById("erkekListesi");
        const kadinListesiDiv = document.getElementById("kadinListesi");
        const efektliIsimDiv = document.getElementById("efektliIsim");
        const travestiFinalDiv = document.getElementById("travestiFinal");
        const travestiYazi = document.getElementById("travestiYazi");

        let eklenenErkekler = [];
        let eklenenKadinlar = [];

        function shakeBody() {
            document.body.classList.add("body-shake");
            setTimeout(() => document.body.classList.remove("body-shake"), 200);
        }

        function addCrackEffect() {
            const crack = document.createElement('div');
            crack.className = 'crack-overlay';
            document.body.appendChild(crack);
            setTimeout(() => crack.remove(), 300);
        }

        function uçanEmojiOlustur(adet = 20) {
            const emojiler = ['🌈', '💋', '💃', '🦄', '🔥', '💄', '👠', '🌟', '🎭', '🍆', '✨', '💎', '🌸', '💖', '🎉', '💅', '👑', '⭐', '🤡', '😈', '💩', '🤣', '😭', '💀'];
            for (let i = 0; i < adet; i++) {
                setTimeout(() => {
                    const emoji = document.createElement('div');
                    emoji.className = 'uçan-emoji';
                    emoji.textContent = emojiler[Math.floor(Math.random() * emojiler.length)];
                    emoji.style.left = Math.random() * 100 + '%';
                    emoji.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
                    emoji.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(emoji);
                    setTimeout(() => emoji.remove(), 3500);
                }, i * 60);
            }
        }

        function listeyeIsimEkle(item) {
            const isim = item.isim;
            const kategori = item.kategori;
            let görünenIsim = isim + (item.ozelNot || "");
            
            if (kategori === "erkek" && !eklenenErkekler.includes(isim)) {
                eklenenErkekler.push(isim);
                const listeItem = document.createElement('div');
                listeItem.className = 'liste-item';
                if (isim === "ALİ") listeItem.classList.add('ali-item');
                listeItem.textContent = görünenIsim;
                listeItem.style.opacity = "0";
                setTimeout(() => {
                    listeItem.style.transition = "all 0.3s ease";
                    listeItem.style.opacity = "1";
                }, 30);
                erkekListesiDiv.appendChild(listeItem);
            } 
            else if (kategori === "kadin" && !eklenenKadinlar.includes(isim)) {
                eklenenKadinlar.push(isim);
                const listeItem = document.createElement('div');
                listeItem.className = 'liste-item';
                if (isim === "SULTAN") listeItem.classList.add('sultan-item');
                listeItem.textContent = görünenIsim;
                listeItem.style.opacity = "0";
                setTimeout(() => {
                    listeItem.style.transition = "all 0.3s ease";
                    listeItem.style.opacity = "1";
                }, 30);
                kadinListesiDiv.appendChild(listeItem);
            }
        }

        function ortadaIsmiGoster(item, index) {
            let gosterilecekIsim = item.isim + (item.ozelNot || "");
            efektliIsimDiv.innerText = gosterilecekIsim;
            
            // Animasyon sınıfını temizle
            efektliIsimDiv.className = '';
            efektliIsimDiv.offsetHeight; // reflow
            
            // Animasyon sınıfını ekle
            let animClass = '';
            switch(item.anim) {
                case 'epic': animClass = 'anim-epic'; break;
                case 'deprem': animClass = 'anim-deprem'; break;
                case 'katlan': animClass = 'anim-katlan'; break;
                case 'catlama': animClass = 'anim-catlama'; break;
                case 'firtina': animClass = 'anim-firtina'; break;
                case 'ziplama': animClass = 'anim-ziplama'; break;
                case 'silkinme': animClass = 'anim-silkinme'; break;
                default: animClass = 'anim-deprem';
            }
            efektliIsimDiv.classList.add(animClass);
            
            // Efektler
            shakeBody();
            addCrackEffect();
            uçanEmojiOlustur(5);
            
            if (item.isim === "ALİ") {
                setTimeout(() => shakeBody(), 100);
                setTimeout(() => addCrackEffect(), 150);
                setTimeout(() => uçanEmojiOlustur(10), 200);
            }
        }

        function travestiFinaliniBaslat() {
            document.body.classList.add("travesti-final");
            document.querySelector('.sol-liste').classList.add('travesti-aninda');
            
            uçanEmojiOlustur(30);
            travestiFinalDiv.classList.add('active');
            
            // 2.5 saniye sonra SENNNNNN YYYOOOOOUUUU
            setTimeout(() => {
                travestiYazi.innerHTML = "💅 SENNNNNN YYYOOOOOUUUU 💅<br><span style='font-size:0.6em'>✨ tttttttttttrraameessttiii ✨</span>";
                
                shakeBody();
                addCrackEffect();
                setTimeout(() => shakeBody(), 200);
                setTimeout(() => addCrackEffect(), 400);
                uçanEmojiOlustur(40);
                
                // Mizah patlamaları
                for (let i = 0; i < 8; i++) {
                    setTimeout(() => {
                        const espri = document.createElement('div');
                        const espiriler = ['🤣🤣🤣', '😭 AĞLAMA', '💀 BİTTİN', '🎭 AYNEN', 'SENİN YÜZÜNDEN', 'KATILIYORUM', '🍆 YOK ARTIK', '💅 KRALİÇE'];
                        espri.textContent = espiriler[Math.floor(Math.random() * espiriler.length)];
                        espri.style.position = 'fixed';
                        espri.style.top = Math.random() * 70 + 15 + '%';
                        espri.style.left = Math.random() * 80 + 10 + '%';
                        espri.style.fontSize = '1.3rem';
                        espri.style.zIndex = '10001';
                        espri.style.pointerEvents = 'none';
                        espri.style.fontWeight = 'bold';
                        espri.style.textShadow = '0 0 5px black';
                        espri.style.animation = 'fadeOut 1s forwards';
                        document.body.appendChild(espri);
                        setTimeout(() => espri.remove(), 1000);
                    }, i * 200);
                }
            }, 2500);
            
            // Emoji yağmuru devam
            const yagmur = setInterval(() => {
                if (travestiFinalDiv.classList.contains('active')) uçanEmojiOlustur(15);
                else clearInterval(yagmur);
            }, 1800);
            
            for (let i = 0; i < 10; i++) setTimeout(() => shakeBody(), i * 150);
        }

        function siradakiIsmiGoster() {
            if (currentIndex >= isimSırası.length) {
                setTimeout(() => travestiFinaliniBaslat(), 500);
                return;
            }
            const item = isimSırası[currentIndex];
            ortadaIsmiGoster(item, currentIndex);
            setTimeout(() => listeyeIsimEkle(item), 600);
            currentIndex++;
            if (currentIndex < isimSırası.length) {
                setTimeout(() => siradakiIsmiGoster(), 2800);
            } else {
                setTimeout(() => travestiFinaliniBaslat(), 3200);
            }
        }

        efektliIsimDiv.innerText = "✨";
        setTimeout(() => siradakiIsmiGoster(), 500);

        document.body.addEventListener("click", () => {
            shakeBody();
            addCrackEffect();
            uçanEmojiOlustur(15);
            if (efektliIsimDiv) {
                efektliIsimDiv.style.transform = "scale(1.05)";
                setTimeout(() => { if(efektliIsimDiv) efektliIsimDiv.style.transform = ""; }, 150);
            }
        });

        console.log("🔥 ANİMASYONLAR AKTİF! Sultan (Küçük Selvinaz) + TRAVESTİLER finali SENNNNNN YYYOOOOOUUUU 🔥");
    </script>
</body>
</html>
